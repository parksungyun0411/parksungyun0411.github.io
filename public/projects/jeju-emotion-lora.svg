      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#fae8ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#jel-bg)"/>
  <!-- 저울 -->
  <path d="M160 40 V150" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
