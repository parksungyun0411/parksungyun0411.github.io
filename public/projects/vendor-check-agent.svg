<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="거래처 점검 에이전트 복구율 실험">
  <defs>
    <linearGradient id="vca-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#vca-bg)"/>
  <!-- 그래프 간선: resolve → confirm → (nts ∥ dart) → report -->
  <g stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M62 100 H98"/>
    <path d="M134 100 L170 64"/>
    <path d="M134 100 L170 136"/>
    <path d="M206 64 L242 100"/>
    <path d="M206 136 L242 100"/>
  </g>
  <!-- 실패 주입 지점 (dart) -->
  <g stroke="#dc2626" stroke-width="2.5" stroke-linecap="round">
    <path d="M181 125 L195 147"/>
    <path d="M195 125 L181 147"/>
  </g>
  <!-- 재시도 루프 -->
  <path d="M206 150 A14 14 0 1 1 196 164" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M193 158 L196 165 L203 162" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 노드 -->
  <g fill="#ffffff" stroke="#b45309" stroke-width="2.5">
    <circle cx="44" cy="100" r="18"/>
    <circle cx="116" cy="100" r="18"/>
    <circle cx="188" cy="64" r="18"/>
    <circle cx="188" cy="136" r="18" stroke="#dc2626"/>
    <circle cx="260" cy="100" r="18"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle" fill="#92400e">
    <text x="44" y="131">resolve</text>
    <text x="116" y="131">confirm</text>
    <text x="188" y="40">nts</text>
    <text x="188" y="176" fill="#dc2626">dart</text>
    <text x="260" y="131">report</text>
  </g>
  <!-- 상단 MCP 라벨 -->
  <rect x="112" y="14" width="96" height="18" rx="9" fill="#b45309"/>
  <text x="160" y="27" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="700">MCP tools</text>
</svg>
